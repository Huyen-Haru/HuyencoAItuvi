<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tử Vi Mr. Hoàng 2026 — Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Serif:wght@400;600&display=swap');
:root{
  --bg:#0d0b06;--card:#181309;--card2:#201a08;--card3:#2a2210;
  --gold:#c8960a;--gold2:#e6b030;--gold-lt:#f7e8a8;--gold-dim:rgba(200,150,10,.12);
  --text:#f0e6cc;--text2:#c8b06a;--text3:#7a6840;--text4:#4a3e25;
  --border:rgba(200,150,10,.22);--border2:rgba(200,150,10,.10);
  --green:#27ae60;--green2:rgba(39,174,96,.15);
  --blue:#2980b9;--blue2:rgba(41,128,185,.15);
  --orange:#e67e22;--orange2:rgba(230,126,34,.15);
  --red:#e74c3c;--red2:rgba(231,76,60,.15);
  --gray:#555;--gray2:rgba(85,85,85,.2);
  --nav-h:62px;--r:14px;--r-sm:9px;--r-xs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.6;min-height:100vh;padding-bottom:var(--nav-h)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
button{font-family:inherit;cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent}
/* ─── TOP BAR ─── */
.topbar{position:sticky;top:0;z-index:100;background:rgba(13,11,6,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border2);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between}
.tb-brand{font-family:'Noto Serif',serif;font-size:14px;color:var(--gold);letter-spacing:.3px}
.tb-sub{font-size:10px;color:var(--text3);margin-top:1px}
.tb-picker{display:flex;align-items:center;gap:6px}
.picker-btn{background:var(--card2);border:1px solid var(--border2);border-radius:var(--r-xs);
  padding:5px 10px;font-size:11.5px;color:var(--text2);cursor:pointer;transition:all .15s}
.picker-btn:hover,.picker-btn.on{background:var(--gold-dim);border-color:var(--border);color:var(--gold)}
/* ─── BOTTOM NAV ─── */
.bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(13,11,6,.97);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);height:var(--nav-h);
  display:flex;align-items:stretch}
.bn-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;transition:all .15s;color:var(--text3);border-top:2px solid transparent}
.bn-tab.on{color:var(--gold);border-top-color:var(--gold)}
.bn-ico{font-size:20px;line-height:1}
.bn-lbl{font-size:10px;font-weight:600;letter-spacing:.2px}
/* ─── VIEWS ─── */
.view{display:none;padding:14px 14px 20px;animation:fadeIn .2s ease}
.view.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* ─── TODAY HERO ─── */
.hero{background:linear-gradient(135deg,#1a1203 0%,#241a06 60%,#1a130a 100%);
  border:1px solid var(--border);border-radius:var(--r);padding:18px 16px 14px;
  margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30px;right:-20px;width:130px;height:130px;
  background:radial-gradient(circle,rgba(200,150,10,.12) 0%,transparent 70%);border-radius:50%}
.hero-date-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.hero-dl-big{font-family:'Noto Serif',serif;font-size:52px;font-weight:600;color:var(--gold2);line-height:1}
.hero-dl-info{flex:1}
.hero-dl-label{font-size:11px;color:var(--text3);margin-bottom:2px}
.hero-dow{font-size:13px;font-weight:700;color:var(--text)}
.hero-month{font-size:11.5px;color:var(--text2)}
.hero-al{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border2)}
.hero-al-date{font-size:14px;font-weight:700;color:var(--gold-lt)}
.hero-al-label{font-size:10.5px;color:var(--text3)}
.hero-canchi{font-size:16px;font-weight:700;color:var(--gold);font-family:'Noto Serif',serif}
.hero-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.hbadge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}
.hb-hoang{background:rgba(200,150,10,.18);border-color:rgba(200,150,10,.5);color:var(--gold2)}
.hb-hac{background:rgba(80,80,100,.2);border-color:rgba(120,120,160,.4);color:#aaa8d0}
.hb-great{background:rgba(39,174,96,.18);border-color:rgba(39,174,96,.5);color:#5dbd77}
.hb-good{background:rgba(41,128,185,.18);border-color:rgba(41,128,185,.5);color:#7ec8e3}
.hb-mid{background:var(--gray2);border-color:rgba(120,120,120,.4);color:#aaa}
.hb-warn{background:rgba(230,126,34,.18);border-color:rgba(230,126,34,.5);color:#f0b070}
.hb-bad{background:rgba(231,76,60,.18);border-color:rgba(231,76,60,.5);color:#ff8a7a}
.hb-truc-g{background:rgba(39,174,96,.12);border-color:rgba(39,174,96,.35);color:#5dbd77}
.hb-truc-r{background:rgba(231,76,60,.12);border-color:rgba(231,76,60,.35);color:#ff8a7a}
.hb-truc-y{background:rgba(230,126,34,.12);border-color:rgba(230,126,34,.35);color:#f0b070}
.hero-rating{display:flex;align-items:center;gap:8px}
.hr-dot{width:10px;height:10px;border-radius:50%}
.hr-txt{font-size:13px;font-weight:700}
/* ─── SECTION ─── */
.sec{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:11px 14px;
  border-bottom:1px solid var(--border2);background:rgba(200,150,10,.04)}
.sec-title{font-size:12.5px;font-weight:700;color:var(--gold)}
.sec-body{padding:12px 14px}
/* ─── TRỰC ADVICE ─── */
.truc-box{background:var(--card2);border-radius:var(--r-sm);padding:11px 13px;font-size:12px;color:var(--text2);line-height:1.6}
/* ─── ACTIVITY FILTER ─── */
.act-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.act-scroll::-webkit-scrollbar{display:none}
.act-chip{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid var(--border2);background:var(--card2);color:var(--text3);
  cursor:pointer;transition:all .15s;white-space:nowrap}
.act-chip.on{background:var(--gold-dim);border-color:var(--border);color:var(--gold2)}
/* ─── CUNG GRID ─── */
.cung-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:520px){.cung-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.cung-grid{grid-template-columns:repeat(4,1fr)}}
.cc{border-radius:var(--r-sm);border:1px solid var(--border2);overflow:hidden;
  cursor:pointer;transition:all .15s;background:var(--card2)}
.cc:hover{border-color:var(--border)}
.cc.expanded{border-color:var(--border)}
.cc-hdr{display:flex;align-items:center;gap:6px;padding:9px 10px}
.cc-ico{font-size:17px;flex-shrink:0}
.cc-info{flex:1;min-width:0}
.cc-name{font-size:11.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-chi{font-size:10px;color:var(--text3)}
.cc-badge{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;flex-shrink:0}
.cc-ev{font-size:11px;color:var(--text2);padding:0 10px 8px;line-height:1.5;border-bottom:1px solid var(--border2)}
.cc-detail{display:none;padding:8px 10px}
.cc.expanded .cc-detail{display:block}
.cc-sao{font-size:10px;color:var(--text3);line-height:1.5;margin-bottom:6px}
.cc-nen{font-size:10.5px;color:#5dbd77;margin-bottom:2px}
.cc-khong{font-size:10.5px;color:#ff8a7a}
.cc-rels{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cc-rel{font-size:9.5px;padding:2px 6px;border-radius:8px;border:1px solid}
/* color classes for cc */
.cc.great{border-left:3px solid var(--green)}
.cc.good{border-left:3px solid var(--blue)}
.cc.mid{border-left:3px solid var(--gray)}
.cc.warn{border-left:3px solid var(--orange)}
.cc.bad{border-left:3px solid var(--red)}
/* ─── FAMILY ROW ─── */
.family-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.family-row::-webkit-scrollbar{display:none}
.fm{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--card2);border:1px solid var(--border2);border-radius:var(--r-sm);
  padding:9px 11px;min-width:70px;text-align:center}
.fm-ico{font-size:22px}
.fm-name{font-size:10px;color:var(--text2);font-weight:600}
.fm-rate{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:8px;margin-top:1px}
/* ─── CALENDAR VIEW ─── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav-btn{background:var(--card2);border:1px solid var(--border2);border-radius:var(--r-xs);
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--text2);cursor:pointer;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--border);color:var(--gold)}
.cal-title{font-family:'Noto Serif',serif;font-size:16px;color:var(--gold);font-weight:600}
.cal-today-btn{background:var(--gold-dim);border:1px solid var(--border);border-radius:var(--r-xs);
  padding:5px 11px;font-size:11px;font-weight:700;color:var(--gold);cursor:pointer}
.cal-wrap{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card2);border-bottom:1px solid var(--border2)}
.cal-dow div{text-align:center;padding:8px 2px;font-size:10px;font-weight:700;color:var(--text3)}
.cal-dow div:last-child{color:#d4875a}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border2)}
.dc{background:var(--bg);padding:5px 3px 4px;text-align:center;cursor:pointer;
  transition:background .1s;position:relative;min-height:54px;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.dc:hover:not(.empty){background:var(--card3)}
.dc.today{background:rgba(200,150,10,.08)}
.dc.empty{visibility:hidden;pointer-events:none}
.dc-num{font-size:14px;font-weight:700;color:var(--text);line-height:1.1}
.dc.today .dc-num{background:var(--gold);color:#000;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.dc-al{font-size:9px;color:var(--text3)}
.dc-cc{font-size:8.5px;color:var(--text4)}
.dc-dot{width:6px;height:6px;border-radius:50%}
.dc.r-great .dc-dot{background:var(--green)}
.dc.r-good .dc-dot{background:var(--blue)}
.dc.r-mid .dc-dot{background:var(--gray)}
.dc.r-warn .dc-dot{background:var(--orange)}
.dc.r-bad .dc-dot{background:var(--red)}
/* ─── YEAR VIEW ─── */
.year-overview{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);
  padding:14px;margin-bottom:14px}
.year-title{font-family:'Noto Serif',serif;font-size:16px;color:var(--gold);margin-bottom:10px}
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:500px){.year-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.year-grid{grid-template-columns:repeat(4,1fr)}}
.ym{background:var(--card2);border:1px solid var(--border2);border-radius:var(--r-sm);
  padding:10px 11px;cursor:pointer;transition:all .15s;border-left:3px solid var(--border2)}
.ym:hover{background:var(--card3);transform:translateY(-1px)}
.ym.great{border-left-color:var(--green)}.ym.good{border-left-color:var(--blue)}
.ym.mid{border-left-color:var(--gray)}.ym.warn{border-left-color:var(--orange)}.ym.bad{border-left-color:var(--red)}
.ym-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ym-num{font-family:'Noto Serif',serif;font-size:24px;color:var(--text3)}
.ym-score{font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px}
.ym-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px}
.ym-chi{font-size:10px;color:var(--text3);margin-bottom:5px}
.ym-bar{height:4px;border-radius:2px;background:var(--border2);overflow:hidden}
.ym-bar-fill{height:100%;border-radius:2px}
.ym-grade{font-size:10px;color:var(--text3);margin-top:4px}
/* ─── YEAR SUMMARY STATS ─── */
.yr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.yr-stat{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-sm);
  padding:10px;text-align:center;border-left:3px solid}
.yr-stat-n{font-size:22px;font-weight:700;line-height:1;margin-bottom:2px}
.yr-stat-l{font-size:9.5px;color:var(--text3)}
/* ─── I CHING (GIEO QUẺ) ─── */
.que-view{text-align:center;padding:20px 14px}
.que-title{font-family:'Noto Serif',serif;font-size:18px;color:var(--gold);margin-bottom:6px}
.que-sub{font-size:12px;color:var(--text3);margin-bottom:24px;line-height:1.6}
.que-btn{background:linear-gradient(135deg,var(--gold),#b8820a);color:#000;
  font-family:'Noto Serif',serif;font-size:17px;font-weight:700;
  border-radius:50%;width:120px;height:120px;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 0 30px rgba(200,150,10,.3),0 4px 16px rgba(0,0,0,.4);
  transition:all .2s;border:3px solid rgba(255,200,50,.3)}
.que-btn:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(200,150,10,.5)}
.que-btn:active{transform:scale(.96)}
.que-btn-ico{font-size:32px;line-height:1}
.que-btn-lbl{font-size:12px;letter-spacing:.5px}
.que-result{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;margin-top:24px;text-align:left;
  animation:slideUp .3s ease;display:none}
.que-result.on{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.que-hex-num{font-size:11px;color:var(--text3);margin-bottom:6px}
.que-hex-char{font-size:56px;line-height:1;text-align:center;margin-bottom:8px;
  color:var(--gold-lt);text-shadow:0 0 20px rgba(200,150,10,.4)}
.que-hex-name{font-family:'Noto Serif',serif;font-size:22px;font-weight:600;color:var(--gold2);
  text-align:center;margin-bottom:4px}
.que-hex-vn{font-size:14px;color:var(--text2);text-align:center;margin-bottom:16px}
.que-divider{height:1px;background:var(--border2);margin:14px 0}
.que-section{margin-bottom:12px}
.que-sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px}
.que-sec-body{font-size:12.5px;color:var(--text);line-height:1.7}
.que-luck{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.que-luck-item{font-size:11px;padding:4px 10px;border-radius:12px;
  background:var(--card2);border:1px solid var(--border2);color:var(--text2)}
/* ─── MONTH PICKER MODAL ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s;display:none}
.modal-overlay.on{display:flex}
.modal-sheet{background:var(--card);border-radius:var(--r) var(--r) 0 0;
  width:100%;max-width:460px;padding:16px;max-height:70vh;overflow-y:auto}
.modal-title{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:12px;text-align:center}
.mpick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mpick-btn{background:var(--card2);border:1px solid var(--border2);border-radius:var(--r-sm);
  padding:10px 6px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;
  text-align:center;transition:all .15s}
.mpick-btn:hover,.mpick-btn.on{background:var(--gold-dim);border-color:var(--border);color:var(--gold)}
.modal-close{width:100%;padding:12px;background:transparent;border:1px solid var(--border2);
  border-radius:var(--r-sm);color:var(--text3);font-size:13px;cursor:pointer;margin-top:10px}
/* ─── DAY DETAIL PANEL (inline) ─── */
.day-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:12px;animation:fadeIn .2s}
.dp-back{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);
  cursor:pointer;margin-bottom:10px;padding:4px 0}
.dp-back:hover{color:var(--text2)}
/* ─── UTILS ─── */
.tag-green{background:var(--green2);border:1px solid rgba(39,174,96,.3);color:#5dbd77}
.tag-blue{background:var(--blue2);border:1px solid rgba(41,128,185,.3);color:#7ec8e3}
.tag-orange{background:var(--orange2);border:1px solid rgba(230,126,34,.3);color:#f0b070}
.tag-red{background:var(--red2);border:1px solid rgba(231,76,60,.3);color:#ff8a7a}
.tag-gray{background:var(--gray2);border:1px solid rgba(120,120,120,.3);color:#aaa}
.notice{background:rgba(200,150,10,.08);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 13px;font-size:11.5px;color:var(--text2);line-height:1.6;margin-bottom:10px}
.preview-banner{background:linear-gradient(90deg,rgba(200,150,10,.15),rgba(200,150,10,.05));
  border-bottom:1px solid rgba(200,150,10,.2);padding:6px 14px;font-size:10.5px;color:var(--text3);
  text-align:center}
</style>
</head>
<body>

<div class="preview-banner">🔍 PREVIEW — Giao diện mới chờ duyệt · Hiển thị ngày 19/05/2026 · Chưa deploy</div>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="tb-brand">🔮 Tử Vi Mr. Hoàng</div>
    <div class="tb-sub">Năm Bính Ngọ 2026</div>
  </div>
  <div class="tb-picker">
    <button class="picker-btn" onclick="openMonthPicker()">📅 Tháng <span id="cur-m-lbl">4 Âm</span></button>
    <button class="picker-btn" onclick="goCalSolar()">DL 5/2026</button>
  </div>
</div>

<!-- VIEWS -->
<div id="v-today" class="view on"></div>
<div id="v-cal" class="view"></div>
<div id="v-year" class="view"></div>
<div id="v-que" class="view"></div>

<!-- MONTH PICKER -->
<div class="modal-overlay" id="month-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-title">Chọn Tháng Âm Lịch</div>
    <div class="mpick-grid" id="mpick-grid"></div>
    <button class="modal-close" onclick="closeModal()">Đóng</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bot-nav">
  <div class="bn-tab on" id="bn-today" onclick="switchTab('today')">
    <div class="bn-ico">☀️</div>
    <div class="bn-lbl">Hôm Nay</div>
  </div>
  <div class="bn-tab" id="bn-cal" onclick="switchTab('cal')">
    <div class="bn-ico">📅</div>
    <div class="bn-lbl">Lịch</div>
  </div>
  <div class="bn-tab" id="bn-year" onclick="switchTab('year')">
    <div class="bn-ico">🌟</div>
    <div class="bn-lbl">Năm 2026</div>
  </div>
  <div class="bn-tab" id="bn-que" onclick="switchTab('que')">
    <div class="bn-ico">🎋</div>
    <div class="bn-lbl">Gieo Quẻ</div>
  </div>
</div>

<script>
'use strict';
/* ══════ CORE DATA ══════ */

/* Pre-compute all days */
var ALL=[];
for(var mi=0;mi<12;mi++){
  for(var di=0;di<M_DAYS[mi];di++){
    var dl=new Date(M_START[mi].getTime()+di*86400000);
    var cc=getCC(dl);
    ALL.push({m:mi+1,d:di+1,dl:dl,cc:cc,r:rateDay(cc.chi,LN[mi])});
  }
}
function getDay(m,d){return ALL.find(function(x){return x.m===m&&x.d===d;});}
function lookupBySolar(sm,sd){return ALL.find(function(d){return d.dl.getMonth()===sm&&d.dl.getDate()===sd;});}
function getSolarDays(sm){return ALL.filter(function(d){return d.dl.getMonth()===sm;});}

/* ══════ STATE ══════ */
var curTab='today';
var curLunarMonth=4; // default tháng 4 âm (May 2026)
var curSolarMonth=4; // 0-based, May=4
var selectedDayObj=null;
var calMode='solar'; // 'solar' or 'lunar'
var curActivity='all';

/* ══════ TABS ══════ */
function switchTab(t){
  curTab=t;
  ['today','cal','year','que'].forEach(function(id){
    document.getElementById('v-'+id).classList.toggle('on',id===t);
    document.getElementById('bn-'+id).classList.toggle('on',id===t);
  });
  if(t==='today')renderToday(selectedDayObj);
  else if(t==='cal')renderCal();
  else if(t==='year')renderYear();
  else if(t==='que')renderQue();
}

function goCalSolar(){
  calMode='solar';
  curSolarMonth=4;
  switchTab('cal');
}

/* ══════ CALENDAR VIEW ══════ */
function renderCal(){
  var el=document.getElementById('v-cal');
  var sm=curSolarMonth; // 0-based
  var smName=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];

  var h='';
  h+='<div class="cal-header">';
  h+='<button class="cal-nav-btn" onclick="calPrev()">‹</button>';
  h+='<div class="cal-title">'+smName[sm]+' 2026</div>';
  h+='<button class="cal-nav-btn" onclick="calNext()">›</button>';
  h+='</div>';
  h+='<button class="cal-today-btn" onclick="calGoToday()" style="margin-bottom:12px">Hôm Nay</button>';

  // Build calendar grid
  var year=sm===11?2027:2026;
  var month=sm; // JS month 0-based
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();

  h+='<div class="cal-wrap">';
  h+='<div class="cal-dow">';
  DOW_S.forEach(function(d){h+='<div>'+d+'</div>';});
  h+='</div>';
  h+='<div class="cal-grid">';

  for(var i=0;i<firstDay;i++)h+='<div class="dc empty"></div>';

  var today=new Date();
  for(var dd=1;dd<=daysInMonth;dd++){
    var dayObj=lookupBySolar(sm,dd);
    var isToday=(today.getMonth()===sm&&today.getDate()===dd&&today.getFullYear()===year);
    var cls='dc';
    if(isToday)cls+=' today';
    if(dayObj)cls+=' r-'+dayObj.r;
    var al=dayObj?dayObj.d+'/'+dayObj.m:'';
    var cc=dayObj?dayObj.cc.can[0]+dayObj.cc.chi:'';
    h+='<div class="'+cls+'" onclick="calSelectDay('+sm+','+dd+')">';
    h+='<div class="dc-num">'+dd+'</div>';
    h+='<div class="dc-al">'+al+'</div>';
    h+='<div class="dc-cc">'+cc+'</div>';
    if(dayObj)h+='<div class="dc-dot"></div>';
    h+='</div>';
  }
  h+='</div></div>';

  el.innerHTML=h;
}

function calPrev(){if(curSolarMonth>0){curSolarMonth--;renderCal();}}
function calNext(){if(curSolarMonth<11){curSolarMonth++;renderCal();}}
function calGoToday(){var now=new Date();curSolarMonth=now.getMonth();renderCal();}
function calSelectDay(sm,dd){
  var d=lookupBySolar(sm,dd);
  if(d){selectedDayObj=d;switchTab('today');}
}

/* ══════ YEAR VIEW ══════ */
function renderYear(){
  var el=document.getElementById('v-year');
  var h='';

  // Stats
  var best=0,good=0,mid=0,bad=0;
  ALL.forEach(function(d){if(d.r==='great')best++;else if(d.r==='good')good++;else if(d.r==='mid')mid++;else bad++;});
  h+='<div class="yr-stats">';
  h+='<div class="yr-stat" style="border-left-color:#27ae60"><div class="yr-stat-n" style="color:#27ae60">'+best+'</div><div class="yr-stat-l">Ngày Rất Tốt</div></div>';
  h+='<div class="yr-stat" style="border-left-color:#2980b9"><div class="yr-stat-n" style="color:#2980b9">'+good+'</div><div class="yr-stat-l">Ngày Tốt</div></div>';
  h+='<div class="yr-stat" style="border-left-color:#e74c3c"><div class="yr-stat-n" style="color:#e74c3c">'+bad+'</div><div class="yr-stat-l">Ngày Cẩn Thận</div></div>';
  h+='</div>';

  h+='<div class="year-overview">';
  h+='<div class="year-title">🌟 Năm Bính Ngọ 2026 — Tổng Quan 12 Tháng</div>';
  h+='<div class="year-grid">';
  for(var mi=0;mi<12;mi++){
    var sc=M_SCORE[mi];
    var rc=sc>=8?'great':sc>=7?'good':sc>=5?'mid':sc>=4?'warn':'bad';
    var fillW=(sc/10*100)+'%';
    var ln=LN[mi];
    h+='<div class="ym '+rc+'" onclick="calGoMonth('+(mi)+','+mi+')">';
    h+='<div class="ym-top">';
    h+='<div class="ym-num">'+(mi+1)+'</div>';
    h+='<span class="ym-score" style="background:'+rateColor(rc)+'20;border:1px solid '+rateColor(rc)+'40;color:'+rateColor(rc)+'">'+sc+'/10</span>';
    h+='</div>';
    h+='<div class="ym-name">Tháng '+M_NAME[mi]+'</div>';
    h+='<div class="ym-chi">LN: '+ln+' · '+M_GRADE[mi]+'</div>';
    h+='<div class="ym-bar"><div class="ym-bar-fill" style="width:'+fillW+';background:'+rateColor(rc)+'"></div></div>';
    h+='<div class="ym-grade" style="font-size:10px;color:var(--text3);margin-top:4px;line-height:1.4">'+M_OV[mi].substring(0,60)+'…</div>';
    h+='</div>';
  }
  h+='</div></div>';

  // Top golden days
  var topDays=ALL.slice().filter(function(d){return d.r==='great';}).slice(0,8);
  if(topDays.length){
    h+='<div class="sec"><div class="sec-hdr"><span class="sec-title">⭐ Ngày Vàng Nổi Bật</span></div><div class="sec-body">';
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    topDays.forEach(function(d){
      h+='<span onclick="selDay('+d.m+','+d.d+')" style="cursor:pointer;background:rgba(39,174,96,.12);border:1px solid rgba(39,174,96,.35);border-radius:20px;padding:4px 10px;font-size:11.5px;color:#5dbd77">'+d.dl.getDate()+'/'+(d.dl.getMonth()+1)+' · '+d.d+'/'+d.m+'🌙</span>';
    });
    h+='</div></div></div>';
  }

  el.innerHTML=h;
}

function calGoMonth(sm,mi){
  curSolarMonth=sm;
  switchTab('cal');
}
function selDay(m,d){
  var day=getDay(m,d);
  if(day){selectedDayObj=day;switchTab('today');}
}

/* ══════ MONTH PICKER ══════ */
function openMonthPicker(){
  var grid=document.getElementById('mpick-grid');
  var h='';
  for(var i=0;i<12;i++){
    h+='<button class="mpick-btn'+(i===curLunarMonth-1?' on':'')+'" onclick="pickMonth('+(i+1)+')">T'+(i+1)+' · '+M_NAME[i]+'<br><small style="font-size:9.5px;opacity:.7">'+M_SCORE[i]+'/10</small></button>';
  }
  grid.innerHTML=h;
  document.getElementById('month-modal').classList.add('on');
}
function pickMonth(m){
  curLunarMonth=m;
  document.getElementById('cur-m-lbl').textContent=m+' Âm';
  closeModal();
  // Go to first day of that lunar month
  var d=getDay(m,1);
  if(d){selectedDayObj=d;curSolarMonth=d.dl.getMonth();}
  renderToday(d);
}
function closeModal(){document.getElementById('month-modal').classList.remove('on');}

function renderQue(){
  var el=document.getElementById('v-que');
  var h='<div class="que-view">';
  h+='<div class="que-title">🎋 Gieo Quẻ Kinh Dịch</div>';
  h+='<div class="que-sub">Tĩnh tâm, hít thở sâu, nghĩ đến câu hỏi trong lòng<br>rồi nhấn nút để nhận quẻ</div>';
  h+='<button class="que-btn" onclick="throwHex()">';
  h+='<div class="que-btn-ico">☯</div>';
  h+='<div class="que-btn-lbl">GIEO QUẺ</div>';
  h+='</button>';
  h+='<div class="que-result" id="que-result"></div>';
  h+='</div>';
  el.innerHTML=h;
}

function throwHex(){
  var idx=Math.floor(Math.random()*64);
  var hx=HEXAGRAMS[idx];
  var res=document.getElementById('que-result');
  if(!res)return;
  var h='';
  h+='<div class="que-hex-num">Quẻ thứ '+hx.n+' trong 64 quẻ</div>';
  h+='<div class="que-hex-char">'+hx.char+'</div>';
  h+='<div class="que-hex-name">'+hx.name+'</div>';
  h+='<div class="que-hex-vn">'+hx.vn+'</div>';
  h+='<div class="que-divider"></div>';
  h+='<div class="que-section"><div class="que-sec-title">Lời Phán</div>';
  h+='<div class="que-sec-body" style="color:var(--gold2);font-style:italic">'+hx.judge+'</div></div>';
  h+='<div class="que-section"><div class="que-sec-title">Ý Nghĩa</div>';
  h+='<div class="que-sec-body">'+hx.img+'</div></div>';
  h+='<div class="que-section"><div class="que-sec-title">Ứng Dụng</div>';
  h+='<div class="que-luck">';
  hx.luck.forEach(function(l){h+='<span class="que-luck-item">'+l+'</span>';});
  h+='</div></div>';
  h+='<div style="margin-top:14px;text-align:center">';
  h+='<button onclick="throwHex()" style="background:var(--gold-dim);border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:12px;font-weight:600;color:var(--gold);cursor:pointer">🔄 Gieo Lại</button>';
  h+='</div>';
  res.className='que-result on';
  res.innerHTML=h;
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
