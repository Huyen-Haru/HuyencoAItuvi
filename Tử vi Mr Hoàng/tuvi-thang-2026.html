<style>

:root{

  --purple:#4a235a;--purple-lt:#ede0f5;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.6}
.page{max-width:960px;margin:0 auto;padding:24px 16px 80px}
a.back{display:inline-flex;align-items:center;gap:6px;color:var(--amber);font-size:12px;font-weight:600;text-decoration:none;margin-bottom:20px}

.hero{text-align:center;padding:28px 16px 20px;border-bottom:2px solid var(--gold);margin-bottom:24px}
.hero h1{font-family:'Noto Serif',serif;font-size:21px;color:var(--gold);margin-bottom:7px}
.hero-sub{font-size:12px;color:var(--gray)}

/* TABS */
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px;justify-content:center}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--gray);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500}
.tab.active,.tab:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.tab.r-xau{border-color:var(--red);color:var(--red)}
.tab.r-xau.active,.tab.r-xau:hover{background:var(--red);color:#fff}
.tab.r-tot{border-color:var(--green);color:var(--green)}
.tab.r-tot.active,.tab.r-tot:hover{background:var(--green);color:#fff}

/* MONTH SECTION */
.msec{display:none}
.msec.show{display:block}

/* MONTH HEADER */
.mhdr{
  background:linear-gradient(135deg,#1a1208 0%,#2d1f08 100%);

.mhdr-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.mhdr-left h2{font-family:'Noto Serif',serif;font-size:18px;color:#f5d060;margin-bottom:4px}
.mhdr-left .dates{font-size:11px;color:#c8b882}
.mhdr-score{

.ms-lbl{font-size:10px;color:#c8b882;margin-top:2px}
.mhdr-tags{display:flex;flex-wrap:wrap;gap:5px}
.mt{border-radius:3px;padding:2px 8px;font-size:10.5px;font-weight:600}
.mt-g{background:rgba(46,204,113,.2);color:#5dbd77}
.mt-r{background:rgba(192,57,43,.25);color:#ff8a7a}
.mt-y{background:rgba(212,170,80,.2);color:#d4aa50}
.mt-b{background:rgba(26,82,118,.25);color:#7ec8ec}

.ct{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12px}

.ct td{border:1px solid var(--border);padding:8px 10px;vertical-align:top}
.ct tr:nth-child(even) td{background:rgba(0,0,0,.012)}
.tr-tot td{background:#edf8f0!important}
.tr-xau td{background:#fdf0ee!important}
.tr-warn td{background:#fef9ed!important}
.tr-mid td{background:#f5f3ef!important}
.cname{font-weight:700;font-size:12px}
.cchi{font-size:10px;color:var(--amber);font-weight:700;margin-left:3px}
.csao{font-size:10px;color:var(--gray);font-style:italic;margin-top:1px}
.rel-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.rt{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
.rt-g{background:var(--green-lt);color:var(--green);border:1px solid #a0d8a8}
.rt-r{background:var(--red-lt);color:var(--red);border:1px solid #e8a0a0}
.rt-y{background:var(--orange-lt);color:var(--orange);border:1px solid #d4aa50}
.rt-b{background:var(--blue-lt);color:var(--blue);border:1px solid #9ec8ec}
.rt-m{background:var(--gray-lt);color:var(--gray);border:1px solid #ccc}
.cnx{font-size:11.5px;line-height:1.6;margin-top:4px}
.nens{font-size:11px;color:var(--green);margin-top:3px}
.khong{font-size:11px;color:var(--red);margin-top:2px}
.crating{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:700;margin-top:3px}
.cr-tot{background:var(--green);color:#fff}
.cr-kha{background:var(--blue);color:#fff}
.cr-mid{background:var(--gray);color:#fff}
.cr-can{background:#c8960a;color:#fff}
.cr-xau{background:var(--red);color:#fff}

/* OVERALL BOX */
.ovbox{border-radius:8px;padding:12px 16px;margin-bottom:16px;border-left:4px solid;font-size:12px;line-height:1.7}
.ov-tot{background:var(--green-lt);border-color:var(--green);color:var(--green)}
.ov-kha{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
.ov-mid{background:var(--gray-lt);border-color:var(--gray);color:var(--gray)}
.ov-warn{background:var(--orange-lt);border-color:#c8960a;color:var(--orange)}
.ov-xau{background:var(--red-lt);border-color:var(--red);color:var(--red-dk)}
.ov-title{font-weight:700;font-size:12.5px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.ov-body{color:var(--ink)}

.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:20px 0}
</style>
</head>

// Hàm tính quan hệ xung/hợp giữa lưu nguyệt và cung
function calcRel(ln, cung){
  var rels=[];
  if(ln===cung) rels.push({cls:'rt-g',txt:'Trực Kích ⚡'});
  if(isXung(ln,cung)) rels.push({cls:'rt-r',txt:'Xung ☇'});
  if(isTamHop(ln,cung)) rels.push({cls:'rt-g',txt:'Tam Hợp ✦'});
  if(isHop(ln,cung)) rels.push({cls:'rt-b',txt:'Lục Hợp ☯'});
  if(!rels.length) rels.push({cls:'rt-m',txt:'Trung Lập'});
  return rels;
}

// Tự động chấm điểm cung theo lưu nguyệt
function scoreRel(ln, c){
  var score=0;
  var isHung=c.hung;
  var isTot=c.tot;
  if(ln===c.chi){ score += isHung ? -3 : 3; }
  if(isXung(ln,c.chi)){ score -= isHung ? 2 : 3; }
  if(isTamHop(ln,c.chi)){ score += isHung ? -1 : 2; }
  if(isHop(ln,c.chi)){ score += 1; }
  if(isTot) score+=1;
  if(score>=4) return 'tot';
  if(score>=2) return 'kha';
  if(score>=-1) return 'mid';
  if(score>=-3) return 'warn';
  return 'xau';
}

// Sinh nhận xét chi tiết theo tháng và cung
function genNX(ln, c, month){
  var m=month+1; // tháng 1-based
  var isHung=c.hung;
  var isTot=c.tot;
  var star=(c.sao||'').split(',')[0].trim(); // sao chủ

  if(ln===c.chi){
    if(isHung) return 'Lưu nguyệt T'+m+' ('+ln+') đóng thẳng vào '+c.ten+' — hung tinh '+star+' bị kích, đây là tâm điểm cảnh báo của tháng. Cần đặc biệt thận trọng, phòng ngừa rủi ro thuộc lĩnh vực '+c.ten.toLowerCase()+'.';
    if(isTot) return 'Lưu nguyệt T'+m+' ('+ln+') đóng thẳng vào '+c.ten+' — '+star+' được kích hoạt mạnh, cung phát huy tối đa. Đây là cung trọng tâm nên chủ động tận dụng cơ hội thuộc '+c.ten.toLowerCase()+'.';
    return 'Lưu nguyệt T'+m+' ('+ln+') đóng thẳng vào '+c.ten+' — '+star+' được kích hoạt, lĩnh vực '+c.ten.toLowerCase()+' thành tâm điểm tháng: chú ý cả cơ hội lẫn áp lực.';
  }
  if(isXung(ln,c.chi)){
    if(isHung) return 'Lưu nguyệt '+ln+' xung cung hung '+c.ten+' ('+c.chi+', '+star+') — có thể là dịp đối mặt và xử lý dứt điểm vấn đề tồn đọng, nhưng phải rất cẩn trọng suốt tháng.';
    if(isTot) return 'Lưu nguyệt '+ln+' xung '+c.ten+' ('+c.chi+') — sao tốt '+star+' bị chấn động, lĩnh vực '+c.ten.toLowerCase()+' dễ trục trặc/biến động dù nền tảng vững; nên xử lý mềm mỏng, tránh va chạm.';
    return 'Lưu nguyệt '+ln+' xung '+c.ten+' ('+c.chi+', '+star+') — lĩnh vực này chịu áp lực từ bên ngoài trong tháng.';
  }
  if(isTamHop(ln,c.chi)){
    if(isHung) return 'Lưu nguyệt '+ln+' tam hợp cung hung '+c.ten+' ('+c.chi+', '+star+') — cung bị kéo "động", dễ phát sinh rắc rối thuộc '+c.ten.toLowerCase()+'; cảnh giác nhưng không quá lo.';
    return 'Lưu nguyệt '+ln+' tam hợp '+c.ten+' ('+c.chi+') — '+star+' được nâng đỡ tốt, lĩnh vực '+c.ten.toLowerCase()+' hanh thông, phối hợp thuận trong tháng.';
  }
  if(isHop(ln,c.chi)){
    return 'Lưu nguyệt '+ln+' lục hợp '+c.ten+' ('+c.chi+') — quan hệ hài hòa, '+star+' được hỗ trợ nhẹ, thuận để vun đắp lĩnh vực '+c.ten.toLowerCase()+'.';
  }
  return 'Lưu nguyệt T'+m+' không tác động trực tiếp '+c.ten+' — lĩnh vực này vận hành ổn định theo sao bản mệnh '+star+'.';
}

// Sinh khuyến cáo Nên/Không theo quan hệ lưu nguyệt của từng tháng
function genAdvice(ln, c){
  var isHung=c.hung, np, kp;
  if(ln===c.chi){
    if(isHung){ np='Cung hung bị kích — phòng thủ tối đa: '; kp='Tuyệt đối tránh tháng này: '; }
    else { np='Cung trọng tâm tháng, ưu tiên cao nhất: '; kp='Tối kỵ trong tháng: '; }
  } else if(isXung(ln,c.chi)){
    if(isHung){ np='Cung hung bị xung — dịp xử lý dứt điểm, rất thận trọng: '; kp='Rất tránh khi cung bị xung: '; }
    else { np='Cung bị xung, giữ mình & xử lý mềm mỏng: '; kp='Đặc biệt tránh khi bị xung: '; }
  } else if(isTamHop(ln,c.chi)){
    if(isHung){ np='Cung hung bị kéo động — chủ động kiểm soát: '; kp='Cảnh giác: '; }
    else { np='Được tam hợp nâng đỡ, tranh thủ: '; kp='Dù thuận vẫn tránh: '; }
  } else if(isHop(ln,c.chi)){
    np='Được lục hợp hỗ trợ nhẹ, thuận để: '; kp='Tránh: ';
  } else {
    np='Duy trì ổn định: '; kp='Tránh: ';
  }
  return {nen: np+NEN[c.key], khong: kp+KHONG[c.key]};
}

// RENDER
// ══════════════════════════════════════════════════════
function renderMonth(m){
  var idx=m-1;
  var ln=LUU_NGUYET[idx];
  var dl=DL[idx];
  var ov=MOVERVIEW[idx];
  var score=MSCORE[idx];
  var grade=MGRADE[idx];

  var scoreColor=score>=8?'#2ecc71':score>=7?'#5dade2':score>=6?'#f0b429':score>=5?'#e67e22':'#e74c3c';

  var html='';
  // Header
  html+='<div class="mhdr">';
  html+='<div class="mhdr-top"><div class="mhdr-left">';
  html+='<h2>Tháng '+m+' Âm Lịch 2026 — Lưu Nguyệt: '+ln+'</h2>';
  html+='<div class="dates">📅 Dương lịch: '+dl+'</div>';
  html+='</div>';
  html+='<div class="mhdr-score"><div class="ms-num" style="color:'+scoreColor+'">'+score+'</div><div class="ms-lbl">/ 10 · '+grade+'</div></div>';
  html+='</div>';

  // Tags
  html+='<div class="mhdr-tags">';
  html+='<span class="mt mt-y">Lưu Nguyệt: '+ln+'</span>';
  CUNGS.forEach(function(c){
    if(c.chi===ln) html+='<span class="mt mt-b">Đóng tại: '+c.ten+' ('+c.chi+')</span>';
  });
  // Xung của lưu nguyệt
  CUNGS.forEach(function(c){
    if(isXung(ln,c.chi)) html+='<span class="mt mt-r">Xung: '+c.ten+' ('+c.chi+')</span>';
  });
  html+='</div>';
  html+='</div>'; // end mhdr

  // Overview
  html+='<div class="ovbox '+ov.cls+'">';
  html+='<div class="ov-title">'+ov.title+'</div>';
  html+='<div class="ov-body">'+ov.body+'</div>';
  html+='</div>';

  // Cung table
  html+='<table class="ct"><tr>';
  html+='<th width="15%">Cung</th>';
  html+='<th width="18%">Quan Hệ<br>Lưu Nguyệt</th>';
  html+='<th width="9%">Điểm</th>';
  html+='<th width="58%">Phân Tích & Khuyến Cáo Tháng '+m+'</th>';
  html+='</tr>';

  CUNGS.forEach(function(c){
    var rels=calcRel(ln,c.chi);
    var det=(CUNG_DETAIL[c.key]&&CUNG_DETAIL[c.key][idx])?CUNG_DETAIL[c.key][idx]:null;
    var sc=(det&&det.score)?det.score:scoreRel(ln,c);
    var trCls=sc==='tot'?'tr-tot':sc==='xau'||sc==='warn'?'tr-xau':sc==='mid'?'tr-mid':'';
    var crCls='cr-'+sc;
    var crTxt=sc==='tot'?'Rất Tốt':sc==='kha'?'Tốt':sc==='mid'?'Bình':sc==='warn'?'Cẩn Thận':'Xấu';
    var nx=(det&&det.nx)?det.nx:genNX(ln,c,idx);
    var adv=genAdvice(ln,c);
    var nenTxt=(det&&det.nen)?det.nen:adv.nen;
    var khongTxt=(det&&det.khong)?det.khong:adv.khong;

    html+='<tr class="'+trCls+'"><td>';
    html+=c.icon+' <span class="cname">'+c.ten+'</span><span class="cchi">'+c.chi+'</span>';
    html+='<div class="csao">'+c.sao+'</div>';
    html+='</td><td>';
    html+='<div class="rel-tags">';
    rels.forEach(function(r){ html+='<span class="rt '+r.cls+'">'+r.txt+'</span>'; });
    html+='</div>';
    html+='</td><td><span class="crating '+crCls+'">'+crTxt+'</span></td>';
    html+='<td><div class="cnx">'+nx+'</div>';
    html+='<div class="nens">✅ Nên: '+nenTxt+'</div>';
    html+='<div class="khong">⛔ Không: '+khongTxt+'</div>';
    html+='</td></tr>';
  });

  html+='</table>';

  // Navigation
  html+='<div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px">';
  if(m>1) html+='<button onclick="clickTab('+(m-1)+')" style="background:var(--gold-lt);color:var(--amber);border:1px solid #d4aa50;border-radius:20px;padding:5px 14px;cursor:pointer;font-family:inherit;font-weight:600">← Tháng '+(m-1)+'</button>';
  else html+='<span></span>';
  if(m<12) html+='<button onclick="clickTab('+(m+1)+')" style="background:var(--gold-lt);color:var(--amber);border:1px solid #d4aa50;border-radius:20px;padding:5px 14px;cursor:pointer;font-family:inherit;font-weight:600">Tháng '+(m+1)+' →</button>';
  else html+='<a href="index.html" style="background:var(--gold-lt);color:var(--amber);border:1px solid #d4aa50;border-radius:20px;padding:5px 14px;text-decoration:none;font-weight:600">← Trang Chủ</a>';
  html+='</div>';

  return html;
}

function showMonth(m, btn){
  document.getElementById('m-root').innerHTML=renderMonth(m);
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  if(btn) btn.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function clickTab(m){
  var tabs=document.querySelectorAll('.tab');
  showMonth(m, tabs[m-1]);
}

// Init
showMonth(1, document.querySelector('.tab'));
